spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/banking_db
    username: banking_user
    password: banking_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Spring Boot ต่อ Database PostgreSQL ที่เรารันด้วย Docker

# ddl-auto: update คือถ้าแก้ไข Entity จะอัปเดต Table ให้เลยอัตโนมัติ (Dev เท่านั้น ห้ามใช้ Production)